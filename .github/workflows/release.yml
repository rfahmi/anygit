name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-release:
    name: Build AnyGit .dmg
    runs-on: macos-26
    env:
      HAS_SIGNING_CERTS: ${{ secrets.DEVELOPER_ID_CERT_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY_CREDS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v6

      - name: Import Developer ID certificate into temporary keychain
        if: env.HAS_SIGNING_CERTS == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)

          rm "$CERT_PATH"

      - name: Build signed Archive
        if: env.HAS_SIGNING_CERTS == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Maple.xcodeproj \
            -scheme Maple \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/AnyGit.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive

          xcodebuild \
            -exportArchive \
            -archivePath build/AnyGit.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist .github/workflows/ExportOptions.plist

      - name: Build ad-hoc Release .app
        if: env.HAS_SIGNING_CERTS != 'true'
        run: |
          set -o pipefail
          xcodebuild \
            -project Maple.xcodeproj \
            -scheme Maple \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/derived \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

          mkdir -p build/export
          cp -R build/derived/Build/Products/Release/AnyGit.app build/export/AnyGit.app

      - name: Create .dmg
        run: |
          set -euo pipefail
          APP_PATH="build/export/AnyGit.app"
          DMG_NAME="AnyGit-${GITHUB_REF_NAME:-dev}.dmg"

          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg
          fi

          create-dmg \
            --volname "AnyGit" \
            --window-size 540 360 \
            --icon-size 96 \
            --icon "AnyGit.app" 140 180 \
            --app-drop-link 400 180 \
            --no-internet-enable \
            "$GITHUB_WORKSPACE/$DMG_NAME" \
            "$APP_PATH"

      - name: Notarize and staple .dmg
        if: env.HAS_SIGNING_CERTS == 'true' && env.HAS_NOTARY_CREDS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          DMG_PATH="$GITHUB_WORKSPACE/AnyGit-${GITHUB_REF_NAME:-dev}.dmg"

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: AnyGit-${{ github.ref_name || 'dev' }}
          path: AnyGit-*.dmg

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AnyGit-*.dmg
          generate_release_notes: true
          body: |
            ## Install

            1. Download `AnyGit-${{ github.ref_name }}.dmg`
            2. Open the `.dmg` and drag `AnyGit.app` into `Applications`
            3. Launch `AnyGit` (if macOS Gatekeeper warns on an ad-hoc build, run `xattr -cr /Applications/AnyGit.app`)

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING_CERTS == 'true'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
